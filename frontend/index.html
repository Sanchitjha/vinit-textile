    <!-- Open Graph / Twitter fallbacks — kept static so link-preview bots (WhatsApp,
         Facebook, Twitter, Slack) that don't execute JS still get a proper card.
         Page-specific values (set via react-helmet-async once the app mounts) win
         for browsers and Googlebot, which do execute JS. -->
    <meta data-default="true" property="og:type" content="website" />
    <meta data-default="true" property="og:site_name" content="Vinit Textiles" />
    <meta data-default="true" property="og:title" content="Vinit Textiles | Sarees That Celebrate Indian Naree" />
    <meta data-default="true" property="og:description" content="Premium sarees, lehengas and ethnic wear crafted for every Indian celebration. Surat, Gujarat." />
    <meta data-default="true" property="og:image" content="https://vinit-textiles.vercel.app/images/og-default.jpg" />
    <meta data-default="true" property="og:url" content="https://vinit-textiles.vercel.app/" />
    <meta data-default="true" name="twitter:card" content="summary_large_image" />
    <meta data-default="true" name="twitter:title" content="Vinit Textiles | Sarees That Celebrate Indian Naree" />
    <meta data-default="true" name="twitter:description" content="Premium sarees, lehengas and ethnic wear crafted for every Indian celebration. Surat, Gujarat." />
    <meta data-default="true" name="twitter:image" content="https://vinit-textiles.vercel.app/images/og-default.jpg" />
