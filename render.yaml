# Render Blueprint for the Vinit Textiles API.
#
# Render dashboard -> New -> Blueprint -> pick the GitHub repo "vinit-textile" -> Apply.
# Render creates the service from this file and asks once for the secrets marked `sync: false`.
# The database is MongoDB Atlas (external), so nothing else is provisioned here.
#
# Real secrets are never stored in this file: JWT secrets are generated by Render, everything
# else is typed into the dashboard (Environment tab) and survives redeploys.

services:
  - type: web
    name: vinit-textiles-api
    runtime: node
    region: singapore # closest Render region to India
    plan: free # free sleeps after ~15 min idle (slow first request); "starter" keeps it always on
    rootDir: backend
    # --include=dev: the TypeScript build needs devDependencies, even if NODE_ENV is ever set to production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true # redeploy on every push to the default branch
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_VERSION
        value: v1

      # Refuse to boot if MONGO_URI / JWT secrets are missing instead of falling back to the public dev defaults.
      - key: STRICT_ENV
        value: "true"
      # Render's load balancer is one proxy hop; makes req.ip (and the rate limiters) per client.
      - key: TRUST_PROXY_HOPS
        value: "1"

      # Generated by Render on first deploy. Changing them signs everyone out.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d

      - key: CORS_ORIGIN
        value: https://www.vinittextiles.com,https://vinittextiles.com,https://vinit-textiles.vercel.app

      - key: LOW_STOCK_THRESHOLD
        value: "5"
      - key: FREE_SHIPPING_THRESHOLD
        value: "2000"
      - key: STANDARD_SHIPPING_FEE
        value: "99"

      - key: DELHIVERY_BASE_URL
        value: https://track.delhivery.com
      - key: CLERK_ISSUER
        value: https://clerk.vinittextiles.com
      - key: AWS_REGION
        value: ap-south-1

      # --- Secrets: Render asks for these when you apply the Blueprint ---
      - key: MONGO_URI # MongoDB Atlas connection string (mongodb+srv://...)
        sync: false
      - key: CLERK_SECRET_KEY # Clerk dashboard -> API keys -> Secret key (Production instance)
        sync: false
      - key: DELHIVERY_API_TOKEN # Delhivery One -> Settings -> API and MCP Setup
        sync: false
      - key: AWS_ACCESS_KEY_ID # S3 image uploads
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false

      # Not set on purpose:
      # - RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET: checkout is Cash on Delivery only
      #   until Razorpay is connected (add them later and online payment switches on by itself).
      # - ALLOW_STUB_PAYMENTS: local development only, never on a deployed server.
      # - NODE_ENV: leave unset until the rate limits are confirmed to work per client (see backend/DEPLOY.md);
      #   production mode lowers the API limit to 1500 requests / 15 min per IP.
